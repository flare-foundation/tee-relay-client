name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if stable release
        id: check
        run: |
          # align with build-docker.yml: stable only for strict semver tags
          if [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog
        run: |
          tag="${GITHUB_REF_NAME}"
          {
            sed -n "/^## .*\[${tag}\]/,/^## .*\[v/{/^## .*\[v/!p}" CHANGELOG.md || true
            echo
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/blob/${tag}/CHANGELOG.md"
          } > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE: ${{ steps.check.outputs.stable }}
        run: |
          args=(--notes-file release-notes.md)
          if [[ "${STABLE}" == "true" ]]; then
            args+=(--latest=true)
          else
            args+=(--prerelease --latest=false)
          fi
          gh release create "${GITHUB_REF_NAME}" "${args[@]}"
